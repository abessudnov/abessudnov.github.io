on:
  push:
    branches: [quarto]

name: Render and Publish

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render site
        run: quarto render

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          # why: writes CNAME into the published branch on every deploy, so the
          # custom domain never depends on Quarto happening to copy the root file.
          cname: abessudnov.net
          # why: force_orphan (force-push of a fresh orphan branch) was dropped —
          # replacing gh-pages history caused GitHub to clear the Pages custom-domain
          # setting, which took abessudnov.net offline in Aug 2026.
